name: test-and-build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    # macOS is covered by the macOS packaging job below (it runs the app self-test) and by local
    # runs; a macOS test job here would make every build wait for GitHub's scarce arm64 runners.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      # Ghostscript draws the exported PDF/EPS in a test, to catch fonts that only some
      # viewers can display (Windows: Chinese text in Microsoft YaHei)
      - name: Ghostscript for the PDF/EPS font test (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          choco install ghostscript -y --no-progress
          $gs = Get-ChildItem "C:\Program Files\gs\*\bin\gswin64c.exe" | Select-Object -First 1
          if ($gs) { "GALVAPLOT_GS=$($gs.FullName)" >> $env:GITHUB_ENV }
      - run: python -m unittest discover -s tests -v

  package:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt "pyinstaller>=6.5"
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import galvaplot; print(galvaplot.__version__)')" >> "$GITHUB_OUTPUT"
      - run: pyinstaller --noconfirm galvaplot.spec

      # ---------------- Windows: installer + portable zip ----------------
      - name: Self-test packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          GALVAPLOT_SELFTEST: ${{ github.workspace }}\selftest
        run: |
          $p = Start-Process -FilePath dist\GalvaPlot\GalvaPlot.exe -Wait -PassThru
          Get-Content selftest\selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\GalvaPlot -DestinationPath "dist\GalvaPlot-${{ steps.ver.outputs.version }}-Windows-x64-portable.zip"
      - name: Build installer (Windows, Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer\galvaplot.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Test installer - silent install, self-test, uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          GALVAPLOT_SELFTEST: ${{ github.workspace }}\selftest_installed
        run: |
          $setup = "dist\GalvaPlot-${{ steps.ver.outputs.version }}-Windows-Setup.exe"
          $dir = Join-Path $env:RUNNER_TEMP "GalvaPlotInstall"
          $i = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART", "/DIR=$dir" -Wait -PassThru
          if ($i.ExitCode -ne 0) { Write-Error "installer exit code $($i.ExitCode)"; exit 1 }
          $r = Start-Process -FilePath (Join-Path $dir "GalvaPlot.exe") -Wait -PassThru
          Get-Content selftest_installed\selftest.txt
          if ($r.ExitCode -ne 0) { exit 1 }
          $u = Start-Process -FilePath (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait -PassThru
          if ($u.ExitCode -ne 0) { Write-Error "uninstaller exit code $($u.ExitCode)"; exit 1 }
      # In-app update ("立即更新"): install this build, let it update itself to the newest published
      # release (it pretends to be 0.0.1), check the installed version changed. Network-dependent,
      # so it does not block the release; read its log.
      - name: Test in-app update (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          GALVAPLOT_SELFTEST_UPDATE: "1"
          GALVAPLOT_FAKE_VERSION: "0.0.1"
          GALVAPLOT_UPDATE_NO_RELAUNCH: "1"
          GALVAPLOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $setup = "dist\GalvaPlot-${{ steps.ver.outputs.version }}-Windows-Setup.exe"
          $i = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART" -Wait -PassThru
          if ($i.ExitCode -ne 0) { Write-Error "installer exit code $($i.ExitCode)"; exit 1 }
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{9BDACDDD-97AA-49AD-8DC8-2F80B081866D}_is1"
          $dir = (Get-ItemProperty $key).InstallLocation
          $before = (Get-ItemProperty $key).DisplayVersion
          $latest = (Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GALVAPLOT_GITHUB_TOKEN" } "https://api.github.com/repos/${{ github.repository }}/releases/latest").tag_name.TrimStart("v")
          Write-Host "installed $before in $dir; newest published release: $latest"
          $updLog = Join-Path $env:TEMP "galvaplot_update.log"
          $setupLog = Join-Path $env:TEMP "galvaplot_setup.log"
          Remove-Item $updLog, $setupLog -ErrorAction SilentlyContinue
          $exe = Join-Path $dir "GalvaPlot.exe"
          $exeBefore = (Get-Item $exe).LastWriteTimeUtc
          # wait for the app process only, as when a user runs it ("-Wait" would also wait for, and
          # own, the Setup process the app starts)
          $r = Start-Process -FilePath $exe -PassThru
          $null = $r.Handle
          $r.WaitForExit()
          Write-Host "app exit code $($r.ExitCode)"
          for ($t = 0; $t -lt 150; $t++) {
            Start-Sleep -Seconds 2
            if ((Test-Path $setupLog) -and (Select-String -Path $setupLog -Pattern "Log closed" -Quiet)) { break }
          }
          Write-Host "---- processes"
          Get-Process | Where-Object { $_.Name -like "*Setup*" -or $_.Name -like "GalvaPlot*" -or $_.Name -like "is-*" } | Format-Table Id, Name, StartTime -AutoSize | Out-String | Write-Host
          Write-Host "---- updater log"
          Get-Content $updLog -ErrorAction SilentlyContinue
          Write-Host "---- setup log"
          Get-Content $setupLog -ErrorAction SilentlyContinue
          $now = (Get-ItemProperty $key).DisplayVersion
          $exeAfter = (Get-Item $exe).LastWriteTimeUtc
          $ok = (Test-Path $setupLog) -and (Select-String -Path $setupLog -Pattern "Installation process succeeded" -Quiet)
          Write-Host "installed version after the update: $now; exe time $exeBefore -> $exeAfter; setup succeeded: $ok"
          Start-Process -FilePath (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
          if ($r.ExitCode -ne 0 -or -not $ok -or $now -ne $latest) { exit 1 }

      # ---------------- macOS: drag-to-install disk image ----------------
      - name: Self-test packaged app (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
          GALVAPLOT_SELFTEST: ${{ github.workspace }}/selftest
        run: |
          dist/GalvaPlot.app/Contents/MacOS/GalvaPlot
          cat selftest/selftest.txt
      - name: Build DMG (macOS)
        if: runner.os == 'macOS'
        run: bash tools/make_dmg.sh dist/GalvaPlot.app "dist/GalvaPlot-${{ steps.ver.outputs.version }}-macOS-AppleSilicon.dmg"
      - name: Test DMG - mount, copy app out, self-test (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
          GALVAPLOT_SELFTEST: ${{ github.workspace }}/selftest_dmg
        run: |
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" dist/GalvaPlot-*-macOS-AppleSilicon.dmg
          test -L "$mnt/Applications"
          test -f "$mnt/.DS_Store" && test -f "$mnt/.background/background.tiff"   # window layout + first-launch picture
          ditto "$mnt/GalvaPlot.app" "$RUNNER_TEMP/GalvaPlot.app"
          hdiutil detach "$mnt"
          "$RUNNER_TEMP/GalvaPlot.app/Contents/MacOS/GalvaPlot"
          cat selftest_dmg/selftest.txt
      - name: Test in-app update (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
          GALVAPLOT_SELFTEST_UPDATE: "1"
          GALVAPLOT_FAKE_VERSION: "0.0.1"
          GALVAPLOT_UPDATE_NO_RELAUNCH: "1"
          GALVAPLOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          d="$RUNNER_TEMP/update_test"
          mkdir -p "$d"
          ditto dist/GalvaPlot.app "$d/GalvaPlot.app"
          log="$(python -c 'import tempfile; print(tempfile.gettempdir())')/galvaplot_update.log"
          rm -f "$log"
          "$d/GalvaPlot.app/Contents/MacOS/GalvaPlot"
          for i in $(seq 1 180); do grep -q -E "^done|failed|keeping" "$log" 2>/dev/null && break; sleep 1; done
          cat "$log" || true
          latest="$(curl -s -H "Authorization: Bearer $GALVAPLOT_GITHUB_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/latest" | python -c 'import json,sys; print(json.load(sys.stdin)["tag_name"].lstrip("v"))')"
          now="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$d/GalvaPlot.app/Contents/Info.plist")"
          echo "installed version after the update: $now (newest published release: $latest)"
          xattr "$d/GalvaPlot.app"
          test "$now" = "$latest"

      # ---------------- upload ----------------
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-${{ runner.os }}
          path: selftest*
      - uses: actions/upload-artifact@v4
        with:
          name: GalvaPlot-${{ steps.ver.outputs.version }}-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: GalvaPlot ${{ github.ref_name }}
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg

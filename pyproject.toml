[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "galvaplot"
dynamic = ["version"]
description = "Drag-and-drop plotting for battery test files (LAND .cex, Neware .ndax): voltage profiles, cycling, dQ/dV"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "PySide6-Essentials>=6.5", "openpyxl>=3.1", "xlrd>=2.0"]
keywords = ["battery", "LAND", "蓝电", "cex", "Neware", "新威", "ndax", "electrochemistry", "plotting"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Intended Audience :: Science/Research",
]

[project.gui-scripts]
galvaplot = "galvaplot.gui.app:main"

[tool.setuptools.dynamic]
version = { attr = "galvaplot.__version__" }

[tool.setuptools.packages.find]
include = ["galvaplot*"]

[tool.setuptools.package-data]
"galvaplot.gui" = ["icon.png"]
